<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)" />
    <script>
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}

    <meta name="keywords" content="code converter, AI, programming, Python, JavaScript, TypeScript, Java, PHP, Go, SQL, Prisma" />

    <title>AI Code Converter — translate code between 14 languages</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
