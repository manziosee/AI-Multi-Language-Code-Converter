# Render Blueprint — New > Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: ai-code-converter-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # set in the dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://ai-multi-language-code-converter.vercel.app
